latitude_deg = 55.245
longitude_deg = 89.919
altitude_m = 487.5
label = "launch site"

# | Location | Latitude / Longitude (DMS) | Latitude / Longitude (Decimal) | Altitude / Elevation (MSL) |
# | --- | --- | --- | --- |
# | **Camp David** | 39° 38′ 54″ N, 77° 27′ 54″ W | 39.64833° N, -77.46500° W | ~1,850–1,900 ft (564–579 m) |
# | **Pentagon** | 38° 52′ 16″ N, 77° 03′ 21″ W | 38.87099° N, -77.05596° W | ~30–40 ft (9–12 m) |
# | **CENTCOM** | 27° 50′ 58″ N, 82° 31′ 16″ W | 27.84934° N, -82.52122° W | ~14 ft (4.3 m) |

[[aimpoints]]
latitude_deg = 38.897639
longitude_deg = -77.036552
altitude_m = 24.0
label = "aimpoint"

[profile]
architecture = "fractional-orbital-single"
parking_altitude_m = 150e3
entry_interface_altitude_m = 100e3
ballistic_entry_angle_deg = 21.8
# burnout_flight_path_angle_deg omitted -> minimum-energy gamma*.
# Omission is meaningful: it delegates the choice, and survives a change
# of range in a way that writing the current gamma* as a number would not.

[vehicle]
ballistic_coefficient_kg_m2 = 20000.0
lift_to_drag = 0.0
imu_grade = "aviation"
boost_burn_time_s = 300.0
