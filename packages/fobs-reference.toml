# A fractional-orbital reference scenario.
#
# Everything below is a *choice*; nothing derivable from these choices is
# recorded here, so this file and a version of the repository together
# reproduce a run exactly.

schema = "passes.launch-package/1"

# Root-level scalars MUST appear before the first [table] header: in TOML a
# bare key written after one belongs to that table. The loader rejects
# unknown keys precisely so that this mistake cannot pass silently — it
# caught exactly this error in the first draft of this file.
arrival_time_s = 4200.0
objectives = ["warning_time", "burnout_speed"]

[metadata]
name = "fractional-orbital reference"
description = """
Mid-latitude continental launch against a coastal aimpoint, flown as a
fractional-orbital profile. Used as the default scenario in
notebooks/fobs-warning-analysis.ipynb.
"""
author = "PASSES"
created = "2026-08-06"

